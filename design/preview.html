<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PalmEnsemble 设计验证</title>
<style>
:root{--accent:#78e6d0;--surface:#182132;--raised:#243047;--text:#f4f7fb;--muted:#a9b4c6;--pending:#f3c969;--danger:#ff7b7b;--brand:#9dd7ff;--orb:#78e6d0;--cell:9vw;--gap:1vw;font-family:Inter,"Noto Sans SC",sans-serif;color:var(--text);background:#090d16}*{box-sizing:border-box}body{margin:0;min-height:100vh;overflow-x:hidden;background:radial-gradient(circle at 50% 20%,#1b2940 0,#0a101d 45%,#070a11 100%)}button,select{font:inherit;color:inherit}.lab{position:fixed;left:16px;top:16px;width:290px;padding:16px;border:1px solid #42516a;border-radius:20px;background:#111a29eb;z-index:20;max-height:calc(100vh - 32px);overflow:auto}.lab h1{font-size:20px;margin:0 0 6px}.lab p{color:var(--muted);font-size:12px;margin:4px 0 12px}.group{margin:12px 0}.group label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.group select,.group button{width:100%;min-height:38px;border:1px solid #53647e;border-radius:10px;background:#202c40;padding:7px}.row{display:flex;gap:6px}.row>*{flex:1}.stage{min-height:100vh;margin-left:310px;display:grid;grid-template-columns:160px minmax(620px,1fr) 160px;grid-template-rows:1fr auto 1fr;align-items:center;gap:24px;padding:36px 4vw 30px;perspective:1000px}.title{grid-column:1/4;text-align:center;align-self:end}.title h2{font-size:30px;margin:0}.title p{color:var(--muted);margin:6px}.bank{display:grid;grid-template-columns:1fr;gap:16px;justify-items:center}.bank.left{grid-column:1;grid-row:2}.bank.right{grid-column:3;grid-row:2}.orb{--c:var(--orb);width:82px;height:82px;border-radius:50%;border:3px solid #ffffff55;background:radial-gradient(circle at 33% 28%,#fff9 0 6%,var(--c) 25%,color-mix(in srgb,var(--c),#000 40%) 80%);box-shadow:0 0 25px color-mix(in srgb,var(--c),transparent 45%),inset 0 -12px 20px #0005;display:grid;place-items:center;position:relative;cursor:pointer;transition:.18s ease}.orb .icon{font-size:26px}.orb small{position:absolute;top:88px;white-space:nowrap;color:var(--text);font-size:13px}.orb.focused{transform:scale(1.05);outline:3px solid white}.orb.grabbed{transform:translateY(-8px) scale(1.05);box-shadow:0 0 35px var(--c)}.orb.pending:after{content:"";position:absolute;inset:-9px;border:3px dashed var(--pending);border-radius:50%}.orb.placed{opacity:.52}.orb.disabled{opacity:.35}.orb.error:before{content:"!";position:absolute;right:-6px;top:-8px;color:#111;background:var(--danger);clip-path:polygon(50% 0,100% 100%,0 100%);padding:5px 8px 2px}.instrument{grid-column:2;grid-row:2;align-self:center}.track{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;position:relative;padding:18px;border-radius:26px;background:#111a29;border:1px solid #3c4c65;box-shadow:0 18px 70px #0008;transform:rotateX(8deg)}.cell{height:145px;border:2px solid #506078;border-radius:18px;background:linear-gradient(#243047,#172132);position:relative;cursor:pointer;display:grid;grid-template-rows:1fr 1fr;place-items:center;overflow:hidden}.cell:after{content:attr(data-label);position:absolute;bottom:5px;right:9px;color:#8190a6;font:600 14px monospace}.slot{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-size:18px;opacity:.96}.slot.pending{border:3px dashed var(--pending);background:#f3c96933;transform:translateY(-5px)}.cell.current{border-color:var(--brand);box-shadow:0 0 30px #9dd7ff88}.scanner{position:absolute;top:6px;bottom:6px;width:calc((100% - 36px)/8);left:18px;border-radius:14px;background:linear-gradient(90deg,transparent,#9dd7ff55,transparent);pointer-events:none;transition:transform .3s linear}.status{text-align:center;color:var(--pending);min-height:28px;margin:14px}.deck{grid-column:1/4;grid-row:3;align-self:start;justify-self:center;display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1040px;padding:16px 20px;border-radius:32px;background:#1a2435d9;backdrop-filter:blur(18px);border:1px solid #6f7f9655;box-shadow:0 12px 40px #0007}.deck button{min-height:56px;padding:0 18px;border:1px solid #718198;border-radius:18px;background:#263348;cursor:pointer}.deck button.primary{background:#2e6f68}.deck button.danger{border-color:var(--danger)}.deck .seg{display:flex}.deck .seg button{border-radius:0}.deck .seg button:first-child{border-radius:16px 0 0 16px}.deck .seg button:last-child{border-radius:0 16px 16px 0}.deck button.selected{outline:3px solid var(--accent)}.deck-status{min-width:190px;color:var(--muted)}.dialog{display:none;position:fixed;inset:0;background:#0009;z-index:40;place-items:center}.dialog.open{display:grid}.dialog-card{width:min(420px,90vw);padding:28px;border-radius:28px;background:#202c40;border:1px solid #708199}.dialog-card button{min-height:56px;padding:0 18px;border-radius:16px;background:#33445e;border:1px solid #718198}.badge{display:inline-flex;gap:6px;align-items:center}.shape{width:12px;height:12px;background:currentColor}.shape.circle{border-radius:50%}.shape.diamond{transform:rotate(45deg)}.shape.dashed{background:transparent;border:2px dashed currentColor;border-radius:50%}.shape.triangle{clip-path:polygon(50% 0,100% 100%,0 100%)}body.compact .stage{grid-template-columns:130px minmax(520px,1fr) 130px}body.compact .deck{max-width:760px}body.constrained .stage{grid-template-columns:150px minmax(430px,1fr) 150px}.constrained .bank{grid-template-columns:1fr 1fr}.constrained .deck{max-width:560px;justify-content:center}.constrained .cell{height:130px}.reduce-motion *{transition:none!important;animation:none!important}.reduce-motion .scanner{display:none}.reduce-motion .cell.current{outline:4px solid var(--brand)}.coach{position:absolute;top:-55px;left:50%;transform:translateX(-50%);background:#f4f7fb;color:#172132;padding:10px 16px;border-radius:14px;white-space:nowrap}.hidden{display:none!important}@media(max-width:1100px){.lab{position:static;width:auto;margin:12px}.stage{margin-left:0;min-width:900px}}
.track.state-dragTarget .cell{border-color:var(--accent);box-shadow:inset 0 0 0 3px #78e6d044}.track.state-pending{border-color:var(--pending)}.track.state-boundaryDisabled{opacity:.55}.track.state-error{border-color:var(--danger)}.deck.state-focused #play{outline:3px solid #fff}.deck.state-playing #play{box-shadow:0 0 22px #78e6d077}.deck.state-pending{border-color:var(--pending)}.deck.state-recording #record{background:#6f2f45;box-shadow:0 0 22px #ff98c877}.deck.state-disabled{opacity:.48}.deck.state-error{border-color:var(--danger)}.coach button{min-height:36px!important;margin-left:8px;padding:0 12px!important;background:#2e6f68!important}.launcher{display:none;position:fixed;inset:0;background:#080c14f2;z-index:35;place-items:center}.launcher.open{display:grid}.launcher-card{text-align:center;padding:36px;border:1px solid #708199;border-radius:30px;background:#182132}.launcher-card button{min-height:58px;padding:0 22px;border-radius:18px;border:1px solid #78e6d0;background:#2e6f68;color:white}.stage.exited{visibility:hidden}
</style>
</head>
<body>
<aside class="lab"><h1>PalmEnsemble · 逻辑验证</h1><p>Web 仅验证状态、绑定和布局关系，不代表 PICO 实机。</p>
<div class="group"><label>顶层状态</label><select id="sceneState"><option>ready_demo</option><option>editing</option><option selected>playing</option><option>playing_pending</option><option>recording_events</option><option>confirm_clear</option></select></div>
<div class="group"><label>布局档位</label><div class="row"><button data-tier="large">Large</button><button data-tier="compact">Compact</button><button data-tier="constrained">Constrained</button></div></div>
<div class="group"><label><input id="reduce" type="checkbox"> Reduce Motion</label><label><input id="fallback" type="checkbox"> fallback 数据</label><label><input id="saveError" type="checkbox"> 保存错误</label></div>
<div class="group"><label>球体状态</label><select id="orbState"><option>available</option><option>focused</option><option>grabbed</option><option>pending</option><option>placed</option><option>disabled</option><option>error</option></select></div>
<div class="group"><label>轨道状态</label><select id="trackState"><option>empty</option><option>editing</option><option>dragTarget</option><option selected>playing</option><option>pending</option><option>error</option><option>boundaryDisabled</option></select></div>
<div class="group"><label>控制带状态</label><select id="deckState"><option>default</option><option>focused</option><option>playing</option><option>pending</option><option>recording</option><option>disabled</option><option>error</option></select></div>
<div class="group"><button id="stackTest">验证状态优先级</button></div><div class="group"><button id="showLauncher">模拟 Launcher</button></div></aside>
<main class="stage" data-state="playing"><header class="title"><h2>把声音放进时间里</h2><p>100 BPM · 4/4 · 每圈 8 格</p></header>
<section class="bank left" id="drumBank"></section><section class="instrument"><div class="track" data-preview-id="track.cells"><div class="scanner" data-preview-id="track.scanner"></div></div><div class="status" data-preview-id="track.status"></div></section><section class="bank right" id="melodyBank"></section>
<section class="deck" data-preview-id="control.deck"><span class="coach hidden" id="coach">先抓一颗球，再放进中间格子 <button id="selfTry">我自己来</button></span><div class="seg" data-preview-id="control.preset"><button data-preset="Lo-fi" class="selected">Lo-fi</button><button data-preset="电子">电子</button><button data-preset="轻摇滚">轻摇滚</button></div><button id="example" data-preview-id="control.example">加载示例</button><button id="play" class="primary" data-preview-id="control.play">Ⅱ 暂停</button><button id="clear" class="danger" data-preview-id="control.clear">清空</button><button id="record" data-preview-id="control.record">● 记录 30 秒</button><span class="deck-status" data-preview-id="control.status">100 BPM · 事件序列（非音频）</span><button id="exit">退出</button></section></main>
<div class="launcher" id="launcher"><div class="launcher-card"><h2>PalmEnsemble</h2><p>把声音放进时间里</p><button id="enterStage" data-preview-id="transition.enterStage">进入空间乐器</button></div></div>
<div class="dialog" id="confirm"><div class="dialog-card"><h2 id="dialogTitle">确认清空？</h2><p id="dialogCopy">播放中的清空会在下一圈生效。</p><div class="row"><button id="cancelDialog">取消</button><button id="confirmDialog">确认</button></div></div></div>
<script>
const sounds=[['kick','底鼓','■','#ff9b73','drum'],['snare','军鼓','▲','#ffcf6b','drum'],['hat','踩镲','◆','#87d7ff','drum'],['clap','拍手','●','#d7a0ff','drum'],['chord','暖和弦','■','#73e0bf','melody'],['bass','圆润贝斯','▲','#77a9ff','melody'],['bell','微光铃','◆','#f4e27f','melody'],['lead','柔和主音','●','#ff98c8','melody']];
const app={state:'playing',tier:'large',reduce:false,fallback:false,orbState:'available',trackState:'playing',deckState:'default',preset:'Lo-fi',playing:true,currentStep:0,active:[['kick','chord'],[null,null],['hat',null],[null,'bass'],['snare','chord'],[null,null],['hat','lead'],[null,null]],pending:null,selected:null,recording:false,remaining:30000,saveError:false,stackRound:0};
function sound(id){return sounds.find(s=>s[0]===id)||['unknown','未知音色','?', '#9dd7ff','drum']}
function orbHtml(s){let [id,name,icon,color]=s;let shown=app.fallback&&id==='kick'?['unknown','未知音色','?', '#9dd7ff']:s;return `<button class="orb ${app.orbState}" style="--c:${shown[3]}" data-id="${id}" data-preview-id="orb.body.${id}" aria-label="${shown[1]}"><span class="icon" data-preview-id="orb.icon.${id}">${shown[2]}</span><small data-preview-id="orb.label.${id}">${shown[1]}</small><i data-preview-id="orb.ring.${id}"></i></button>`}
function renderBanks(){drumBank.innerHTML=sounds.filter(s=>s[4]==='drum').map(orbHtml).join('');melodyBank.innerHTML=sounds.filter(s=>s[4]==='melody').map(orbHtml).join('');document.querySelectorAll('.orb').forEach(x=>x.onclick=()=>{app.selected=x.dataset.id; preview(x.dataset.id); render()})}
function slotsFor(i){if(app.trackState==='empty')return '<span></span><span></span>';let a=app.active[i],p=app.pending&&app.pending[i];return [0,1].map(f=>{let id=p&&p[f]!==a[f]?p[f]:a[f],pending=p&&p[f]!==a[f];if(!id)return '<span></span>';let s=sound(id);return `<span class="slot ${pending?'pending':''}" style="background:${s[3]}" data-preview-id="track.${pending?'pendingOrb':'activeOrb'}.${i}.${f}" title="${s[1]}">${s[2]}</span>`}).join('')}
function renderTrack(){const track=document.querySelector('.track');track.className=`track state-${app.trackState}`;track.dataset.renderState=app.trackState;track.querySelectorAll('.cell').forEach(x=>x.remove());let canPlay=['playing','pending'].includes(app.trackState)&&app.playing;for(let i=0;i<8;i++){let c=document.createElement('button');c.className='cell'+(canPlay&&i===app.currentStep?' current':'');c.dataset.label=i+1;c.dataset.previewId='track.cell.'+i;c.innerHTML=slotsFor(i);c.disabled=['boundaryDisabled','error'].includes(app.trackState);c.onclick=()=>drop(i);track.appendChild(c)}document.querySelector('.scanner').style.transform=`translateX(${app.currentStep*100}%)`;document.querySelector('.scanner').classList.toggle('hidden',!canPlay);let messages={empty:'空轨道 · 抓一颗球开始',editing:'已暂停 · 可以编辑',dragTarget:'松开手柄扳机以吸附',playing:'<span class="badge" style="color:var(--brand)"><i class="shape diamond"></i> 正在播放</span>',pending:'<span class="badge"><i class="shape dashed"></i> 下一圈生效</span>',error:'<span style="color:var(--danger)"><i class="shape triangle"></i> 时钟或音频错误</span>',boundaryDisabled:'正在切换小节 · 暂停放置'};document.querySelector('.status').innerHTML=messages[app.trackState]}
function hasContent(){let patterns=[app.active,app.pending].filter(Boolean);return app.trackState!=='empty'&&patterns.some(p=>p.some(step=>step.some(Boolean)))}
function renderDeck(){const deck=document.querySelector('.deck');deck.className=`deck state-${app.deckState}`;deck.dataset.renderState=app.deckState;play.textContent=(app.playing||app.deckState==='playing')?'Ⅱ 暂停':'▶ 播放';record.textContent=(app.recording||app.deckState==='recording')?`■ 事件记录 ${Math.ceil(app.remaining/1000)}s`:'● 记录 30 秒';let statusByState={default:'100 BPM · 事件序列（非音频）',focused:'播放控制已聚焦',playing:'100 BPM · 正在播放',pending:'100 BPM · 下一圈生效',recording:'记录事件序列 · 非音频',disabled:'控制暂不可用',error:'保存失败 · 事件仍在内存，可重试'};let status=app.saveError?'保存失败 · 事件仍在内存，可重试':(app.pending&&app.deckState==='default'?'100 BPM · 下一圈生效':statusByState[app.deckState]);document.querySelector('.deck-status').textContent=status;document.querySelector('.deck-status').style.color=(app.saveError||app.deckState==='error')?'var(--danger)':'';document.querySelectorAll('[data-preset]').forEach(b=>b.classList.toggle('selected',b.dataset.preset===app.preset));coach.classList.toggle('hidden',app.state!=='ready_demo');deck.querySelectorAll('button').forEach(b=>b.disabled=app.deckState==='disabled');clear.disabled=app.deckState==='disabled'||!hasContent();clear.dataset.hasContent=String(hasContent())}
function render(){document.body.className=(app.tier==='large'?'':app.tier)+' '+(app.reduce?'reduce-motion':'');document.querySelector('.stage').dataset.state=app.state;renderBanks();renderTrack();renderDeck()}
function preview(id){let a=new Audio();document.querySelectorAll('.orb').forEach(o=>o.classList.toggle('focused',o.dataset.id===id))}
function drop(i){if(!app.selected)return;let s=sound(app.selected),f=s[4]==='drum'?0:1;if(app.playing){app.pending=structuredClone(app.active);app.pending[i][f]=app.selected;app.state='playing_pending';app.trackState='pending';app.deckState='pending'}else app.active[i][f]=app.selected;render()}
function tick(){if(!app.playing)return;let next=(app.currentStep+1)%8;if(next===0&&app.pending){app.active=app.pending;app.pending=null;app.state='playing';app.trackState='playing';app.deckState='playing'}app.currentStep=next;renderTrack();renderDeck()}
setInterval(tick,300);
sceneState.onchange=e=>{const previous={state:app.state,trackState:app.trackState,deckState:app.deckState,playing:app.playing};app.state=e.target.value;app.playing=['playing','playing_pending','recording_events'].includes(app.state);const stateMap={ready_demo:['editing','default'],editing:['editing','default'],playing:['playing','playing'],playing_pending:['pending','pending'],recording_events:['playing','recording'],confirm_clear:['boundaryDisabled','disabled']};[app.trackState,app.deckState]=stateMap[app.state];trackState.value=app.trackState;deckState.value=app.deckState;if(app.state==='playing_pending'&&!app.pending){app.pending=structuredClone(app.active);app.pending[1][0]='clap'}if(app.state==='confirm_clear')openDialog('clear',previous);if(app.state==='recording_events')startRecord();render()};
function resolveState(items,precedence){return precedence.find(x=>items.includes(x))}
document.querySelectorAll('[data-tier]').forEach(b=>b.onclick=()=>{app.tier=b.dataset.tier;render()});reduce.onchange=e=>{app.reduce=e.target.checked;render()};fallback.onchange=e=>{app.fallback=e.target.checked;render()};saveError.onchange=e=>{app.saveError=e.target.checked;render()};orbState.onchange=e=>{app.orbState=e.target.value;render()};trackState.onchange=e=>{app.trackState=e.target.value;render()};deckState.onchange=e=>{app.deckState=e.target.value;render()};stackTest.onclick=()=>{const tests=app.stackRound++%2===0?{orb:['available','pending','focused'],track:['playing','pending','dragTarget'],deck:['playing','pending','recording']}:{orb:['grabbed','disabled','error'],track:['dragTarget','boundaryDisabled','error'],deck:['recording','disabled','error']};app.orbState=resolveState(tests.orb,['error','disabled','grabbed','focused','pending','placed','available']);app.trackState=resolveState(tests.track,['error','boundaryDisabled','dragTarget','pending','playing','editing','empty']);app.deckState=resolveState(tests.deck,['error','disabled','recording','pending','playing','focused','default']);orbState.value=app.orbState;trackState.value=app.trackState;deckState.value=app.deckState;stackTest.textContent=`优先级已验证：${app.orbState}/${app.trackState}/${app.deckState}`;stackTest.dataset.stackInputs=JSON.stringify(tests);render()};
document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>{app.preset=b.dataset.preset;if(app.playing&&!app.pending)app.pending=structuredClone(app.active);render()});selfTry.onclick=()=>{app.state='editing';app.playing=false;app.trackState='editing';app.deckState='default';sceneState.value='editing';trackState.value='editing';render()};showLauncher.onclick=()=>{launcher.classList.add('open');document.querySelector('.stage').classList.add('exited')};enterStage.onclick=()=>openDialog('enter');example.onclick=()=>{app.active=[['kick','chord'],[null,null],['hat',null],[null,'bass'],['snare','chord'],[null,null],['hat','lead'],[null,null]];app.playing=true;app.state='playing';app.trackState='playing';render()};play.onclick=()=>{app.playing=!app.playing;app.state=app.playing?(app.pending?'playing_pending':'playing'):'editing';app.trackState=app.playing?(app.pending?'pending':'playing'):'editing';render()};clear.onclick=()=>openDialog('clear');exit.onclick=()=>openDialog('exit');record.onclick=()=>app.recording?stopRecord():startRecord();
let recTimer;function startRecord(){app.recording=true;app.remaining=30000;app.state='recording_events';app.deckState='recording';clearInterval(recTimer);recTimer=setInterval(()=>{app.remaining-=1000;if(app.remaining<=0)stopRecord();renderDeck()},1000);render()}function stopRecord(){clearInterval(recTimer);app.recording=false;app.state=app.playing?'playing':'editing';app.deckState=app.playing?'playing':'default';render()}
function confirmLayer(){return document.getElementById('confirm')}function openDialog(kind,previous){const layer=confirmLayer();layer.classList.add('open');layer.dataset.kind=kind;layer.dataset.previousState=JSON.stringify(previous||{state:app.state,trackState:app.trackState,deckState:app.deckState,playing:app.playing});dialogTitle.textContent=kind==='clear'?'确认清空？':kind==='enter'?'进入空间乐器？':'退出空间乐器？';dialogCopy.textContent=kind==='clear'?'播放中的清空会在下一圈生效。':kind==='enter'?'将打开 Mixed Stage；随时可退出返回。':'将关闭 Full Space Stage，返回系统。'}cancelDialog.onclick=()=>{const layer=confirmLayer(),prev=JSON.parse(layer.dataset.previousState);Object.assign(app,prev);sceneState.value=app.state;trackState.value=app.trackState;deckState.value=app.deckState;layer.classList.remove('open');render()};confirmDialog.onclick=()=>{const layer=confirmLayer(),kind=layer.dataset.kind;if(kind==='clear'){if(app.playing){app.pending=Array.from({length:8},()=>[null,null]);app.state='playing_pending';app.trackState='pending';app.deckState='pending'}else{app.active=Array.from({length:8},()=>[null,null]);app.trackState='empty'}}else if(kind==='enter'){launcher.classList.remove('open');document.querySelector('.stage').classList.remove('exited');app.state='ready_demo';app.playing=false;app.trackState='editing';app.deckState='default';sceneState.value='ready_demo';trackState.value='editing';deckState.value='default'}else{app.playing=false;app.recording=false;clearInterval(recTimer);app.currentStep=0;app.selected=null;app.state='launcher';app.trackState='editing';app.deckState='disabled';launcher.classList.add('open');document.querySelector('.stage').classList.add('exited')}layer.classList.remove('open');render()};
const captureMode=new URLSearchParams(location.search).get('capture');if(captureMode){document.querySelector('.lab').style.display='none';document.querySelector('.stage').style.marginLeft='0';app.demo=false;if(captureMode==='editing'){app.state='editing';app.playing=false;app.trackState='editing';app.deckState='default'}else{app.state='playing';app.playing=true;app.trackState='playing';app.deckState='playing'}}
render();
</script></body></html>
